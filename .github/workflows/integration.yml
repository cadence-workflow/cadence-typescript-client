name: Integration tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Cadence integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      COMPOSE_FILE: tests/integration/docker-compose.yaml
      CADENCE_ADDRESS: 127.0.0.1:7833
      CADENCE_DOMAIN: default

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck integration tests
        run: npm run typecheck:integration

      - name: Start Cadence
        run: docker compose up --detach --wait --wait-timeout 120 cadence

      - name: Run integration tests
        run: npm run test:integration

      - name: Print Cadence logs on failure
        if: failure()
        run: docker compose logs --no-color cadence statsd

      - name: Stop Cadence
        if: always()
        run: docker compose down --volumes --remove-orphans
