name: Publish to npm

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    if: github.repository == 'cadence-workflow/cadence-typeescript-sdk'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "${package_version}" && "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish package
        run: npm publish --ignore-scripts --access public
